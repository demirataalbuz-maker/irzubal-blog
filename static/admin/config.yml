# irzubal.com · Sveltia CMS yapılandırması
# Giriş: GitHub (Netlify OAuth sağlayıcısı üzerinden). Her kayıt main dalına commit = yayın.
# ATLAS seçenekleri tools/cms-atlas-secenekleri.py ile data/atlas.yaml'dan üretilir; elle düzenleme.

backend:
  name: github
  repo: demirataalbuz-maker/irzubal-blog
  branch: main

site_url: https://irzubal.com
display_url: https://irzubal.com

media_folder: static/images
public_folder: /images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

i18n:
  structure: multiple_files
  locales: [tr, en]
  default_locale: tr

collections:
  # ------------------------------------------------------------------ Olaylar
  - name: incidents
    label: Olaylar
    label_singular: Olay
    folder: content/incidents
    path: "{{slug}}/index"
    create: true
    i18n: true
    slug:
      template: "{{slug}}"
      editable: [create]
      hint: "Adres parçası, ör. echoleak-m365-copilot. Kısa, küçük harf, tire ile."
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Sadece küçük harf, rakam ve tire"]
    summary: "{{title}}"
    sortable_fields: [date, title, severity]
    fields:
      - { name: title, label: Başlık, widget: string, i18n: true }
      - name: summary
        label: Özet
        widget: text
        i18n: true
        hint: "Kartlarda ve arama sonuçlarında görünen 1-2 cümle."
      - name: date
        label: Yayın tarihi
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
        i18n: duplicate
      - name: draft
        label: Taslak
        widget: boolean
        default: false
        i18n: duplicate
        hint: "Açıkken yazı sitede görünmez."
      - name: incident_date
        label: Açıklanma tarihi
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        i18n: duplicate
        hint: "Olayın kamuya açıklandığı gün."
      - { name: org, label: Etkilenen ürün / kurum, widget: string, i18n: duplicate, hint: "ör. Microsoft 365 Copilot" }
      - name: cve
        label: CVE
        widget: string
        required: false
        i18n: duplicate
        pattern: ["^CVE-\\d{4}-\\d{4,}$", "Biçim: CVE-2025-32711"]
      - name: cvss
        label: CVSS puanı
        widget: number
        value_type: float
        min: 0
        max: 10
        step: 0.1
        required: false
        i18n: duplicate
      - name: severity
        label: Önem
        widget: select
        default: high
        i18n: duplicate
        options:
          - { label: Low / Düşük, value: low }
          - { label: Medium / Orta, value: medium }
          - { label: High / Yüksek, value: high }
          - { label: Critical / Kritik, value: critical }
      - name: status
        label: Durum
        widget: select
        default: confirmed
        i18n: duplicate
        options:
          - { label: Confirmed / Doğrulandı, value: confirmed }
          - { label: Disputed / Tartışmalı, value: disputed }
      - name: buckets
        label: Kategori
        widget: select
        multiple: true
        min: 1
        max: 2
        default: [ai-system-vulnerability]
        i18n: duplicate
        options:
          - { label: AI as attacker / Saldırgan olarak AI, value: ai-as-attacker }
          - { label: AI system vulnerability / AI sistem zafiyeti, value: ai-system-vulnerability }
      - name: owasp
        label: OWASP LLM Top 10 (2025)
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options:
          - { label: "LLM01 · Prompt Injection / Prompt Enjeksiyonu", value: LLM01 }
          - { label: "LLM02 · Sensitive Information Disclosure / Hassas Bilgi İfşası", value: LLM02 }
          - { label: "LLM03 · Supply Chain / Tedarik Zinciri", value: LLM03 }
          - { label: "LLM04 · Data and Model Poisoning / Veri ve Model Zehirleme", value: LLM04 }
          - { label: "LLM05 · Improper Output Handling / Hatalı Çıktı İşleme", value: LLM05 }
          - { label: "LLM06 · Excessive Agency / Aşırı Yetki", value: LLM06 }
          - { label: "LLM07 · System Prompt Leakage / Sistem Prompt Sızıntısı", value: LLM07 }
          - { label: "LLM08 · Vector and Embedding Weaknesses / Vektör ve Gömme Zafiyetleri", value: LLM08 }
          - { label: "LLM09 · Misinformation / Yanlış Bilgi", value: LLM09 }
          - { label: "LLM10 · Unbounded Consumption / Sınırsız Kaynak Tüketimi", value: LLM10 }
      - name: atlas
        label: MITRE ATLAS teknikleri
