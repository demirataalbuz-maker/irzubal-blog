<!doctype html>
<html lang="{{ site.Language.Lang }}" data-theme="dark" data-lens="purple">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
