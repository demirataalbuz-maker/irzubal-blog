{{ define "main" }}
<article class="wrap page">
  <header class="page-head">
    <p class="dateline"><span>{{ .Title }}</span><span>{{ site.Params.author }}</span></p>
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Params.lede }}<p class="page-lede">{{ . }}</p>{{ end }}
  </header>
  <div class="prose page-prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
