{{ define "main" }}
<section class="wrap page-head">
  <p class="dateline"><span>{{ len .Pages }} {{ i18n "stat_incidents" }}</span></p>
  <h1 class="page-title">{{ .Title }}</h1>
  <p class="page-lede">{{ i18n "incidents_lede" }}</p>
</section>
<section class="wrap">
  <div class="stories">
    {{- range .Pages }}{{ partial "card.html" . }}{{ end }}
  </div>
</section>
{{ end }}
